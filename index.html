<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Producción Costura V3.5</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f6f5;
      font-family: Segoe UI, Arial, sans-serif;
      color: #192622;
    }
    .app { display: flex; min-height: 100vh; }
    aside {
      width: 220px;
      background: #101a20;
      color: #fff;
      padding: 18px 16px;
    }
    .brand {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: .06em;
      margin-bottom: 18px;
    }
    .nav {
      background: #21342f;
      padding: 12px;
      border-radius: 8px;
      color: #dfe7e3;
    }
    main {
      flex: 1;
      padding: 28px 26px;
    }
    h1 { margin: 0 0 8px; }
    .sub {
      color: #687873;
      margin-bottom: 18px;
    }
    .panel {
      background: #fff;
      border: 1px solid #dfe8e5;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 18px rgba(21, 59, 50, 0.06);
    }
    .folio {
      background: #f7faf9;
      border: 1px solid #dfe8e5;
      border-radius: 9px;
      padding: 12px 16px;
      margin-bottom: 18px;
    }
    .folio label { display: block; font-weight: 700; margin-bottom: 4px; }
    #barcode { display: block; margin-top: 8px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 14px;
    }
    .field {
      display: grid;
      gap: 6px;
    }
    label {
      font-size: 10px;
      color: #71807c;
      text-transform: uppercase;
      font-weight: 700;
    }
    input, select {
      height: 40px;
      border: 1px solid #dfe8e5;
      border-radius: 8px;
      padding: 0 10px;
      background: #fff;
      font-size: 15px;
    }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    button {
      height: 39px;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary { background: #08776b; color: #fff; }
    .secondary { background: #e7efe9; color: #173b35; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 20px; display: inline-block; }
    .ok { color: #0f7d52; font-weight: 700; }
    .err { color: #b42318; font-weight: 700; }
    .sum {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }
    .kpi {
      border-left: 4px solid #08776b;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(21, 59, 50, 0.04);
    }
    .kpi small { display: block; color: #687873; }
    .kpi b { font-size: 24px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      padding: 9px;
      border-bottom: 1px solid #edf1f0;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: #f6f9f7;
      color: #1f352f;
      font-weight: 700;
    }
    .wrap { overflow-x: auto; }
    @media (max-width: 700px) {
      .app { display: block; }
      aside { width: 100%; }
      .grid, .sum { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <iframe id="hiddenFrame" name="hiddenFrame" style="display:none"></iframe>

  <div class="app">
    <aside>
      <div class="brand">JV International</div>
      <div class="nav">Captura diaria V3.5</div>
    </aside>

    <main>
      <h1>Producción Costura</h1>
      <div class="sub">Captura conectada a Google Sheets.</div>

      <section class="panel">
        <div class="folio">
          <label>Último folio guardado</label>
          <b id="folio">Se asigna al guardar</b>
          <svg id="barcode"></svg>
        </div>

        <form id="form">
          <div class="grid">
            <div class="field">
              <label>Fecha *</label>
              <input id="fecha" type="date" required>
            </div>
            <div class="field">
              <label>Semana ISO</label>
              <input id="semana" type="text" readonly required>
            </div>
            <div class="field">
              <label>Nombre Personal *</label>
              <select id="personal" required></select>
            </div>
            <div class="field">
              <label>Máquina *</label>
              <select id="maquina" required></select>
            </div>
            <div class="field">
              <label>No. Corte *</label>
              <input id="corte" type="text" required>
            </div>
            <div class="field">
              <label>Estilo *</label>
              <input id="estilo" list="estilosLista" required>
              <datalist id="estilosLista"></datalist>
            </div>
            <div class="field">
              <label>Proceso *</label>
              <select id="proceso" required></select>
            </div>
            <div class="field">
              <label>Costo unitario *</label>
              <input id="costo" type="number" min="0" step="0.01" required>
            </div>
            <div class="field">
              <label>Cantidad *</label>
              <input id="cantidad" type="number" min="1" step="1" required>
            </div>
          </div>

          <div class="actions">
            <button id="guardar" class="primary">Guardar en la nube</button>
            <button type="button" id="limpiar" class="secondary">Limpiar</button>
            <button type="button" id="exportar" class="secondary">Exportar sesión CSV</button>
            <span id="status"></span>
          </div>
        </form>
      </section>

      <div class="sum">
        <div class="kpi">
          <small>Registros de sesión</small>
          <b id="kr">0</b>
        </div>
        <div class="kpi">
          <small>Cantidad de sesión</small>
          <b id="kq">0</b>
        </div>
        <div class="kpi">
          <small>Costo de sesión</small>
          <b id="kc">$0.00</b>
        </div>
      </div>

      <section class="panel">
        <b>Capturas confirmadas</b>
        <div id="tabla"></div>
      </section>
    </main>
  </div>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbyiN8WA6qxJlK0s3X6trL_-sI6KTseDezjQ-5LWYyBsA2P5NvK5cf8yAeK-KruRaQ3r1A/exec";

    function guardarGoogle(data) {
      return new Promise((resolve, reject) => {
        const token = 'pc-' + Date.now() + '-' + Math.random().toString(36).slice(2);
        const timer = setTimeout(() => {
          window.removeEventListener('message', onMessage);
          reject(new Error('El servidor no confirmó el guardado en 30 segundos.'));
        }, 30000);

        function onMessage(event) {
          const msg = event.data;
          if (!msg || msg.type !== 'PRODUCCION_COSTURA_RESULT' || msg.token !== token) return;
          clearTimeout(timer);
          window.removeEventListener('message', onMessage);
          if (msg.ok) resolve(msg);
          else reject(new Error(msg.error || 'Error al guardar en Google Sheets.'));
        }

        window.addEventListener('message', onMessage);
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = API;
        form.target = 'hiddenFrame';
        form.style.display = 'none';

        [['payload', JSON.stringify(data)], ['token', token]].forEach(([name, value]) => {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = name;
          input.value = value;
          form.appendChild(input);
        });

        document.body.appendChild(form);
        form.submit();
        setTimeout(() => form.remove(), 1000);
      });
    }

    window.CAT = {
      personal: [
        "CORRIL MACARIO","ELIUD ARCOS","ESPINOZA ISABEL","ESTRADA RAMON","GARCIA GUSTAVO",
        "GARCIA RIGOBERTO","GARCIA VICTOR","GASPAR CLARA","HERNANDEZ GUILLERMO","HERNANDEZ LAURA",
        "HERNANDEZ NICOLAS","JUSTO ELISEO","KAREN","LANDERO JUAN","LOPEZ SANDRA","MALDONADO LUIS",
        "MARCIAL JULIO","MEJIA ROCIO","MONTERO LILIANA","NAVARRO ROSARIO","PARA MIGUEL","PEDRO PABLO",
        "PEDRO PABLO FELIX","PEREZ NIDIA","COLIMB RUIZ","RODRIGO SERRANO","SANCHEZ CRISTINA",
        "SANTOS FELIX","SANTOS FRANCISCO","ZAMORA SAN JUAN"
      ],
      maquinas: ["OVER","COVER","TAPE","SENCILLA"],
      operaciones: ["1ER HOMBRE","2DO HOMBRE","BASTILLA MANGA","BASTILLA RUEDO","BIES CUELLO",
        "BIES SIZA","CERRAR COSTADOS","CERRAR HOMBROS","CLIP","DESHEBRADO","PEGAR CUELLO",
        "PEGAR MANGA","REMACHE","S/ C CUELLO","TAPE","TAPES"],
      estilos: ["BY01","BY02","BY03","BY04","BY05","BY06","GR02","GR08","JR154","JR44","JR47",
        "JR48","MN01","MN02","MN03","TD02"],
      precios: [
        { e: "JR154", o: "CERRAR HOMBROS", c: 0.4 },
        { e: "JR154", o: "PEGAR CUELLO", c: 0.7 },
        { e: "JR154", o: "S/ C CUELLO", c: 0.4 },
        { e: "JR154", o: "PEGAR MANGA", c: 0.8 },
        { e: "JR154", o: "CERRAR COSTADOS", c: 0.9 },
        { e: "JR154", o: "BASTILLA MANGA", c: 0.7 },
        { e: "JR154", o: "BASTILLA RUEDO", c: 0.7 },
        { e: "JR154", o: "DESHEBRADO", c: 0.0 },
        { e: "JR44", o: "CERRAR HOMBROS", c: 0.4 },
        { e: "JR44", o: "PEGAR CUELLO", c: 0.7 },
        { e: "JR44", o: "S/ C CUELLO", c: 0.4 },
        { e: "JR44", o: "PEGAR MANGA", c: 0.8 },
        { e: "JR44", o: "CERRAR COSTADOS", c: 0.9 },
        { e: "JR44", o: "BASTILLA MANGA", c: 0.7 },
        { e: "JR44", o: "BASTILLA RUEDO", c: 0.7 },
        { e: "JR44", o: "DESHEBRADO", c: 0.0 },
        { e: "JR47", o: "CERRAR HOMBROS", c: 0.4 },
        { e: "JR47", o: "PEGAR CUELLO", c: 0.7 },
        { e: "JR47", o: "S/ C CUELLO", c: 0.4 },
        { e: "JR47", o: "PEGAR MANGA", c: 0.8 },
        { e: "JR47", o: "CERRAR COSTADOS", c: 0.9 },
        { e: "JR47", o: "BASTILLA MANGA", c: 0.7 },
        { e: "JR47", o: "BASTILLA RUEDO", c: 0.7 },
        { e: "JR47", o: "DESHEBRADO", c: 0.0 },
        { e: "JR48", o: "CERRAR HOMBROS", c: 0.4 },
        { e: "JR48", o: "PEGAR CUELLO", c: 0.7 },
        { e: "JR48", o: "S/ C CUELLO", c: 0.4 },
        { e: "JR48", o: "PEGAR MANGA", c: 0.8 },
        { e: "JR48", o: "CERRAR COSTADOS", c: 0.9 },
        { e: "JR48", o: "BASTILLA MANGA", c: 0.7 },
        { e: "JR48", o: "BASTILLA RUEDO", c: 0.7 },
        { e: "JR48", o: "DESHEBRADO", c: 0.0 },
        { e: "GR08", o: "CERRAR HOMBROS", c: 0.4 },
        { e: "GR08", o: "PEGAR CUELLO", c: 0.7 },
        { e: "GR08", o: "S/ C CUELLO", c: 0.4 },
        { e: "GR08", o: "PEGAR MANGA", c: 0.8 },
        { e: "GR08", o: "CERRAR COSTADOS", c: 0.9 },
        { e: "GR08", o: "BASTILLA MANGA", c: 0.7 },
        { e: "GR08", o: "BASTILLA RUEDO", c: 0.7 },
        { e: "GR08", o: "DESHEBRADO", c: 0.0 },
        { e: "MN03", o: "CERRAR HOMBROS", c: 0.4 },
        { e: "MN03", o: "PEGAR CUELLO", c: 0.7 },
        { e: "MN03", o: "S/ C CUELLO", c: 0.4 },
        { e: "MN03", o: "TAPE", c: 0.6 },
        { e: "MN03", o: "PEGAR MANGA", c: 0.8 },
        { e: "MN03", o: "CERRAR COSTADOS", c: 0.9 },
        { e: "MN03", o: "BASTILLA MANGA", c: 0.7 },
        { e: "MN03", o: "BASTILLA RUEDO", c: 0.7 },
        { e: "MN03", o: "DESHEBRADO", c: 0.0 },
        { e: "BY02", o: "CERRAR HOMBROS", c: 0.4 },
        { e: "BY02", o: "PEGAR CUELLO", c: 0.7 },
        { e: "BY02", o: "S/ C CUELLO", c: 0.4 },
        { e: "BY02", o: "TAPE", c: 0.6 },
        { e: "BY02", o: "PEGAR MANGA", c: 0.8 },
        { e: "BY02", o: "CERRAR COSTADOS", c: 0.9 },
        { e: "BY02", o: "BASTILLA MANGA", c: 0.7 },
        { e: "BY02", o: "BASTILLA RUEDO", c: 0.7 },
        { e: "BY02", o: "DESHEBRADO", c: 0.0 }
      ]
    };

    const CAT = window.CAT;
    let R = [];

    const $ = x => document.getElementById(x);
    const clean = x => String(x ?? '').trim().replace(/\s+/g, ' ');
    const money = x => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(x || 0);

    function fill(id, arr, label) {
      const el = $(id);
      el.replaceChildren();
      const opt = new Option(label, '');
      el.add(opt);
      arr.forEach(v => el.add(new Option(v, v)));
    }

    function week(v) {
      if (!v) return '';
      const d = new Date(v + 'T12:00:00');
      d.setDate(d.getDate() + 4 - (d.getDay() || 7));
      return Math.ceil((((d - new Date(d.getFullYear(), 0, 1)) / 86400000) + 1) / 7);
    }

    function upd() {
      $('semana').value = week($('fecha').value);
    }

    function price() {
      const e = clean($('estilo').value).toUpperCase();
      const o = clean($('proceso').value).toUpperCase();
      const match = CAT.precios.find(x => x.e === e && x.o === o);
      if (match) $('costo').value = match.c.toFixed(2);
    }

    function status(t, c = '') {
      $('status').textContent = t;
      $('status').className = c;
    }

    function clearForm() {
      const f = $('fecha').value;
      const p = $('personal').value;
      $('form').reset();
      $('fecha').value = f;
      $('personal').value = p;
      upd();
    }

    function render() {
      $('kr').textContent = R.length;
      $('kq').textContent = R.reduce((s, x) => s + Number(x.cantidad || 0), 0);
      $('kc').textContent = money(R.reduce((s, x) => s + Number(x.costoTotal || 0), 0));

      if (!R.length) {
        $('tabla').textContent = 'Sin capturas confirmadas en esta sesión.';
        return;
      }

      const rows = R.slice().reverse().map(x => `
        <tr>
          <td>${x.folio}</td>
          <td>${x.fecha}</td>
          <td>${x.personal}</td>
          <td>${x.maquina}</td>
          <td>${x.corte}</td>
          <td>${x.estilo}</td>
          <td>${x.proceso}</td>
          <td>${x.cantidad}</td>
          <td>${money(x.costoTotal)}</td>
        </tr>
      `).join('');

      $('tabla').innerHTML = `
        <div class="wrap">
          <table>
            <tr>
              <th>Folio</th>
              <th>Fecha</th>
              <th>Personal</th>
              <th>Máquina</th>
              <th>Corte</th>
              <th>Estilo</th>
              <th>Proceso</th>
              <th>Cantidad</th>
              <th>Total</th>
            </tr>
            ${rows}
          </table>
        </div>
      `;
    }

    $('form').addEventListener('submit', async e => {
      e.preventDefault();
      const q = Number($('cantidad').value);
      const c = Number($('costo').value);
      const btn = $('guardar');
      const d = {
        fecha: $('fecha').value,
        semana: Number($('semana').value),
        personal: clean($('personal').value),
        maquina: clean($('maquina').value),
        corte: clean($('corte').value),
        estilo: clean($('estilo').value).toUpperCase(),
        proceso: clean($('proceso').value).toUpperCase(),
        costoUnitario: c,
        cantidad: q
      };

      btn.disabled = true;
      status('Guardando en Google Sheets...');
      try {
        const result = await guardarGoogle(d);
        const registro = { ...d, folio: result.folio, costoTotal: Number(result.costoTotal) };
        R.push(registro);
        localStorage.setItem('jvCosturaRespaldo', JSON.stringify(R));
        $('folio').textContent = result.folio;
        if (window.JsBarcode) {
          JsBarcode('#barcode', result.folio, { format: 'CODE128', height: 42, margin: 4, fontSize: 12 });
        }
        render();
        clearForm();
        status('Captura ' + result.folio + ' guardada en Google Sheets.', 'ok');
      } catch (error) {
        status('No se guardó: ' + error.message, 'err');
      } finally {
        btn.disabled = false;
      }
    });

    function csv() {
      if (!R.length) return alert('No hay capturas.');

      const header = ['Folio', 'Fecha', 'Semana', 'Nombre Personal', 'Maquina', 'No. Corte', 'Estilo', 'Proceso', 'Costo Unitario', 'Cantidad', 'Costo Total'];
      const rows = R.map(x => [x.folio, x.fecha, x.semana, x.personal, x.maquina, x.corte, x.estilo, x.proceso, x.costoUnitario, x.cantidad, x.costoTotal]);
      const csvRows = [header, ...rows].map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));
      const blob = new Blob([csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Produccion_Costura.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    fill('personal', CAT.personal, 'Seleccione personal');
    fill('maquina', CAT.maquinas, 'Seleccione máquina');
    fill('proceso', CAT.operaciones, 'Seleccione proceso');
    CAT.estilos.forEach(x => $('estilosLista').appendChild(new Option(x, x)));

    const saved = localStorage.getItem('jvCosturaRespaldo');
    if (saved) {
      try {
        R = JSON.parse(saved);
      } catch (e) {
        R = [];
      }
    }

    $('fecha').onchange = upd;
    $('estilo').onchange = price;
    $('proceso').onchange = price;
    $('limpiar').onclick = clearForm;
    $('exportar').onclick = csv;

    $('fecha').value = new Date().toISOString().slice(0, 10);
    upd();
    render();
    status('Catalogos cargados: ' + CAT.personal.length + ' personal, ' + CAT.maquinas.length + ' máquinas y ' + CAT.operaciones.length + ' procesos.', 'ok');
  </script>
</body>
</html>
