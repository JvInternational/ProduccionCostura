function options(id,items,label){const el=$(id);el.replaceChildren(new Option(label,''));items.forEach(v=>el.add(new Option(v,v)));}
function uniq(a){return [...new Set(a)].sort((x,y)=>x.localeCompare(y,'es'));}
function isoWeek(v){if(!v)return '';const d=new Date(v+'T12:00:00');d.setDate(d.getDate()+4-(d.getDay()||7));const y=new Date(d.getFullYear(),0,1);return Math.ceil((((d-y)/864e5)+1)/7);}

function cargarAplicaciones(){options('aplicacion',uniq(CAT.tarifas.map(x=>x.a)),'Seleccione aplicación');cargarEstilos();}

function jsonp(params,timeout=20000){return new Promise((resolve,reject)=>{const cb='pc_cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);let sc;const timer=setTimeout(()=>done(new Error('Sin respuesta del servidor.')),timeout);function done(err,val){clearTimeout(timer);delete window[cb];if(sc)sc.remove();err?reject(err):resolve(val);}window[cb]=v=>done(null,v);sc=document.createElement('script');sc.src=API+'?'+new URLSearchParams({...params,callback:cb});sc.onerror=()=>done(new Error('No fue posible consultar la confirmación.'));document.head.appendChild(sc);});}
async function esperarConfirmacion(token){for(let i=0;i<20;i++){await new Promise(r=>setTimeout(r,1000));try{const r=await jsonp({action:'status',token},5000);if(r&&r.pending)continue;if(r&&r.ok)return r;if(r&&!r.ok)throw new Error(r.error||'Error en servidor');}catch(e){if(i===19)throw e;}}throw new Error('La captura pudo guardarse, pero no se obtuvo confirmación.');}
function enviar(data,token){const f=document.createElement('form');f.method='POST';f.action=API;f.target='hiddenFrame';f.style.display='none';for(const [n,v] of Object.entries({payload:JSON.stringify(data),token})){const i=document.createElement('input');i.type='hidden';i.name=n;i.value=v;f.appendChild(i);}document.body.appendChild(f);f.submit();setTimeout(()=>f.remove(),1000);}
$('form').addEventListener('submit',async e=>{e.preventDefault();const btn=$('guardar'),q=Number($('cantidad').value),c=Number($('costo').value);if(!Number.isInteger(q)||q<1||!Number.isFinite(c))return setStatus('Revisa cantidad, estilo, proceso y costo.','err');const d={fecha:$('fecha').value,semana:Number($('semana').value),personal:$('personal').value,maquina:$('maquina').value,corte:clean($('corte').value),aplicacion:$('aplicacion').value,estilo:$('estilo').value,proceso:$('proceso').value,costoUnitario:c,cantidad:q};const token='pc_'+Date.now()+'_'+Math.random().toString(36).slice(2);btn.disabled=true;setStatus('Guardando y confirmando…');try{enviar(d,token);const r=await esperarConfirmacion(token);R.push({...d,folio:r.folio,costoTotal:Number(r.costoTotal)});$('folio').textContent=r.folio;if(window.JsBarcode)JsBarcode('#barcode',r.folio,{format:'CODE128',height:42,margin:4,fontSize:12});render();limpiarFormulario();setStatus('Captura '+r.folio+' guardada correctamente.','ok');}catch(err){setStatus(err.message,'err');}finally{btn.disabled=false;}});
async function ultimoFolio(){try{const r=await jsonp({action:'lastfolio'});if(r.ok){$('folio').textContent=r.folio;if(r.folio!=='PC-000000'&&window.JsBarcode)JsBarcode('#barcode',r.folio,{format:'CODE128',height:42,margin:4,fontSize:12});}}catch(e){$('folio').textContent='Disponible al guardar';}}
function csv(){if(!R.length)return alert('No hay capturas confirmadas.');const h=['Folio','Fecha','Semana','Personal','Maquina','No Corte','Aplicacion','Estilo','Proceso','Costo Unitario','Cantidad','Costo Total'];const rows=R.map(x=>[x.folio,x.fecha,x.semana,x.personal,x.maquina,x.corte,x.aplicacion,x.estilo,x.proceso,x.costoUnitario,x.cantidad,x.costoTotal]);const text='﻿'+[h,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('
');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download='Produccion_Costura.csv';a.click();}
options('personal',CAT.personal,'Seleccione personal');options('maquina',CAT.maquinas,'Seleccione máquina');$('fecha').value=new Date().toISOString().slice(0,10);$('fecha').addEventListener('change',actualizarSemana);$('aplicacion').addEventListener('change',cargarEstilos);$('estilo').addEventListener('change',cargarProcesos);$('proceso').addEventListener('change',actualizarCosto);$('limpiar').addEventListener('click',limpiarFormulario);$('exportar').addEventListener('click',csv);actualizarSemana();cargarAplicaciones();render();ultimoFolio();setStatus(`Catálogos: ${CAT.personal.length} personas, ${CAT.maquinas.length} máquinas, ${uniq(CAT.tarifas.map(x=>x.e)).length} estilos y ${CAT.tarifas.length} tarifas.`,'ok');
</script></body></html>
