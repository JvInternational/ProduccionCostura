<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Administración | JV International
  </title>
  <style>
   :root {
  --nav: #0d1b22;
  --nav2: #173a35;
  --teal: #08776b;
  --bg: #f3f6f5;
  --card: #ffffff;
  --text: #18312d;
  --muted: #72817e;
  --line: #dfe7e4;
  --orange: #f47b20;
}

* {
  box-sizing: border-box;
}

/* Database currently has enough content to show a vertical scrollbar.
   Force the same reserved viewport width in Admin to prevent a page-change jump. */
html {
  overflow-y: scroll;
}

body {
  margin: 0;
  font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* Shared application shell: identical to database.html */
.app {
  display: grid;
  grid-template-columns: 210px 1fr;
  min-height: 100vh;
}

aside {
  background: var(--nav);
  color: #dbe7e4;
  padding: 10px 9px;
}

.brand {
  background: #ffffff;
  color: #18312d;
  border-radius: 6px;
  padding: 13px 10px;
  margin-bottom: 18px;
  font-weight: 900;
  font-style: italic;
  font-size: 13px;
}

.brand img {
  display: block;
  width: 100%;
  max-width: 190px;
  max-height: 54px;
  height: auto;
  object-fit: contain;
}

.brand small {
  display: block;
  margin-top: 2px;
  color: #77847f;
  font-size: 8px;
}

.group {
  margin: 12px 6px 7px;
  color: #6f8380;
  font-size: 8px;
  letter-spacing: 0.12em;
}

nav a {
  display: block;
  margin: 2px 0;
  padding: 9px 10px;
  border-radius: 6px;
  color: #c9d7d4;
  font-size: 12px;
  text-decoration: none;
}

nav a:hover,
nav a.active {
  background: var(--nav2);
  color: #ffffff;
}

main {
  min-width: 0;
  padding: 20px 24px;
}

header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}

h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 4px 0;
  color: var(--muted);
}

.status {
  padding-top: 7px;
  color: var(--muted);
  font-size: 12px;
}

.status.ok {
  color: var(--teal);
  font-weight: 700;
}

/* Admin module */
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 5px 14px #173a3510;
}

.form {
  margin-bottom: 14px;
  padding: 16px;
}

.form h2,
.head h2 {
  margin: 0 0 12px;
  font-size: 14px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(125px, 1fr));
  gap: 11px;
}

label {
  display: block;
  margin-bottom: 5px;
  color: #536661;
  font-size: 10px;
  font-weight: 700;
}

input,
select {
  width: 100%;
  height: 38px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #ffffff;
  color: var(--text);
}

input:focus,
select:focus,
button:focus {
  outline: 3px solid #08776b25;
  border-color: var(--teal);
}

.actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 12px;
}

button {
  padding: 10px 13px;
  border: 0;
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  background: var(--teal);
  color: #ffffff;
}

.secondary {
  background: #e7eeec;
  color: #294640;
}

.danger {
  padding: 7px 10px;
  background: #fff0ef;
  color: #a32b2b;
}

.message {
  display: none;
  margin-bottom: 12px;
  padding: 10px 12px;
  border-radius: 7px;
}

.message.show {
  display: block;
}

.message.err {
  background: #fff1f1;
  color: #a32b2b;
}

.message.good {
  background: #edfdf5;
  color: var(--teal);
}

.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}

.head h2 {
  margin: 0;
}

.head input {
  max-width: 320px;
}

.wrap {
  overflow: auto;
}

table {
  width: 100%;
  min-width: 760px;
  border-collapse: collapse;
}

th,
td {
  padding: 10px;
  border-bottom: 1px solid #edf2f0;
  font-size: 11px;
  text-align: left;
}

th {
  background: #f5f8f7;
  font-size: 9px;
}

.num {
  text-align: right;
}

.empty {
  padding: 30px;
  color: var(--muted);
  text-align: center;
}

[hidden] {
  display: none !important;
}

@media (max-width: 900px) {
  html {
    overflow-y: auto;
  }

  .app {
    grid-template-columns: 1fr;
  }

  aside {
    position: static;
  }

  .brand {
    display: inline-block;
    margin: 0 10px 8px 0;
  }

  nav {
    display: flex;
    gap: 4px;
    overflow: auto;
  }

  .group {
    display: none;
  }

  nav a {
    white-space: nowrap;
  }

  main {
    padding: 14px;
  }

  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 520px) {
  header {
    display: block;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .actions {
    flex-wrap: wrap;
  }

  .head {
    display: block;
  }

  .head input {
    max-width: none;
    margin-top: 9px;
  }
}
  </style>
 </head>
 <body>
  <div class="app">
   <aside>
    <div class="brand">
     <img alt="JV International Solutions Inc." src="Logo_JV%20International.png"/>
    </div>
    <div class="group">
     PRODUCCIÓN COSTURA
    </div>
    <nav>
     <a href="index.html">
      Captura
     </a>
     <a href="dashboard.html">
      Dashboard
     </a>
     <a href="database.html">
      Base de datos
     </a>
     <a class="active" href="admin.html">
      Administración
     </a>
     <a href="reportes.html">
      Reportes
     </a>
    </nav>
   </aside>
   <main>
    <header>
     <div>
      <h1>
       Administración de tarifas
      </h1>
      <p>
       Registra tarifas para estilos existentes o nuevos.
      </p>
     </div>
     <div class="status" id="status">
      Conectando…
     </div>
    </header>
    <div class="message" id="msg">
    </div>
    <section class="panel form">
     <h2>
      Nueva tarifa o actualización
     </h2>
     <form id="form">
      <div class="grid">
       <div>
        <label>
         APLICACIÓN
        </label>
        <select id="aplicacion">
         <option>
          TIENDAS EN GENERAL
         </option>
         <option>
          DC
         </option>
        </select>
       </div>
       <div>
        <label>
         TIPO DE ESTILO
        </label>
        <select id="tipo">
         <option value="existente">
          ESTILO EXISTENTE
         </option>
         <option value="nuevo">
          ESTILO NUEVO
         </option>
        </select>
       </div>
       <div id="boxExistente">
        <label>
         ESTILO EXISTENTE · SELECCIÓN ÚNICA
        </label>
        <select id="estilo">
         <option value="">
          Cargando…
         </option>
        </select>
       </div>
       <div hidden="" id="boxNuevo">
        <label>
         NUEVO ESTILO
        </label>
        <input id="estiloNuevo" maxlength="50" placeholder="Ej. JR200"/>
       </div>
       <div>
        <label>
         OPERACIÓN
        </label>
        <input id="operacion" list="ops" placeholder="Selecciona o escribe" required=""/>
        <datalist id="ops">
        </datalist>
       </div>
       <div>
        <label>
         COSTO
        </label>
        <input id="costo" min="0" placeholder="0.00" required="" step="0.01" type="number"/>
       </div>
      </div>
      <div class="actions">
       <button class="secondary" id="clear" type="button">
        Limpiar
       </button>
       <button class="primary" id="save">
        Guardar tarifa
       </button>
      </div>
     </form>
    </section>
    <section class="panel">
     <div class="head">
      <h2>
       Tarifas registradas
      </h2>
      <input id="search" placeholder="Buscar estilo u operación…" type="search"/>
     </div>
     <div class="wrap">
      <table>
       <thead>
        <tr>
         <th>
          APLICACIÓN
         </th>
         <th>
          ESTILO
         </th>
         <th>
          VARIANTE
         </th>
         <th>
          OPERACIÓN
         </th>
         <th class="num">
          COSTO
         </th>
         <th>
          ACCIÓN
         </th>
        </tr>
       </thead>
       <tbody id="rows">
       </tbody>
      </table>
      <div class="empty" hidden="" id="empty">
       No hay tarifas.
      </div>
     </div>
    </section>
   </main>
  </div>
  <script>
   'use strict';const API='https://script.google.com/macros/s/AKfycbyiN8WA6qxJlK0s3X6trL_-sI6KTseDezjQ-5LWYyBsA2P5NvK5cf8yAeK-KruRaQ3r1A/exec',$=id=>document.getElementById(id);let rates=[];const money=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'});document.addEventListener('DOMContentLoaded',init);
async function req(action,params={},post=false){let r;if(post){const body=new URLSearchParams({action,payload:JSON.stringify(params)});r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body})}else{r=await fetch(API+'?'+new URLSearchParams({action,...params}),{cache:'no-store'})}const d=await r.json();if(!d.ok)throw Error(d.error||'Error de API');return d}
async function init(){$('tipo').addEventListener('change',mode);$('estilo').addEventListener('change',loadOps);$('aplicacion').addEventListener('change',loadOps);$('form').addEventListener('submit',save);$('clear').addEventListener('click',reset);$('search').addEventListener('input',render);await Promise.all([catalogs(),loadRates()]);mode()}
async function catalogs(){try{const d=await req('catalogs'),a=[...new Set((d.catalogs?.estilos||[]).filter(Boolean))].sort();$('estilo').innerHTML='<option value="">Selecciona un estilo</option>'+a.map(x=>`<option>${esc(x)}</option>`).join('');connected()}catch(e){show(e.message,false)}}
function mode(){const n=$('tipo').value==='nuevo';$('boxNuevo').hidden=!n;$('boxExistente').hidden=n;$('estilo').required=!n;$('estiloNuevo').required=n;if(n){$('estilo').value='';$('ops').innerHTML=''}else $('estiloNuevo').value=''}
async function loadOps(){const s=$('estilo').value;if(!s)return $('ops').innerHTML='';try{const d=await req('operations',{estilo:s,variante:$('aplicacion').value==='DC'?'DC':'GENERAL'});$('ops').innerHTML=[...new Set((d.operaciones||[]).map(x=>x.operacion).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')}catch(e){show(e.message,false)}}
async function loadRates(){try{const d=await req('rates');rates=d.tarifas||[];render();connected()}catch(e){show(e.message,false)}}
async function save(e){e.preventDefault();const nuevo=$('tipo').value==='nuevo',estilo=(nuevo?$('estiloNuevo').value:$('estilo').value).trim().toUpperCase(),payload={aplicacion:$('aplicacion').value,estilo,operacion:$('operacion').value.trim(),costo:Number($('costo').value)};if(!estilo||!payload.operacion||!Number.isFinite(payload.costo)||payload.costo<0)return show('Completa estilo, operación y costo válido.',false);try{$('save').disabled=true;await req('saveRate',payload,true);show(nuevo?'Tarifa y estilo nuevo guardados.':'Tarifa guardada.',true);reset();await Promise.all([catalogs(),loadRates()])}catch(x){show(x.message,false)}finally{$('save').disabled=false}}
async function del(s,o,v){if(!confirm(`¿Eliminar ${s} / ${o} / ${v}?`))return;try{await req('deleteRate',{estilo:s,operacion:o,variante:v},true);show('Tarifa eliminada.',true);await loadRates()}catch(e){show(e.message,false)}}
function render(){const q=$('search').value.trim().toUpperCase(),a=rates.filter(r=>!q||[r.estilo,r.operacion,r.aplicacion].some(v=>String(v||'').toUpperCase().includes(q)));$('rows').innerHTML=a.map(r=>`<tr><td>${esc(r.aplicacion||'TIENDAS EN GENERAL')}</td><td>${esc(r.estilo)}</td><td>${esc(r.variante||'GENERAL')}</td><td>${esc(r.operacion)}</td><td class="num">${money.format(Number(r.costo)||0)}</td><td><button type="button" class="danger" data-s="${esc(r.estilo)}" data-o="${esc(r.operacion)}" data-v="${esc(r.variante||'GENERAL')}">Eliminar</button></td></tr>`).join('');$('empty').hidden=!!a.length;document.querySelectorAll('.danger').forEach(b=>b.onclick=()=>del(b.dataset.s,b.dataset.o,b.dataset.v))}
function reset(){$('form').reset();$('ops').innerHTML='';mode()}function connected(){$('status').textContent='● Conectado';$('status').className='ok'}function show(t,g){$('msg').textContent=t;$('msg').className='message show '+(g?'good':'err')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  </script>
 </body>
</html>
