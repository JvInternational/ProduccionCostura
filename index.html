<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producción Costura | JV International</title>
<style>
:root{--p:#08776b;--pd:#056158;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#dbe4ea;--bad:#b91c1c;--ok:#166534}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(180deg,var(--p) 0 180px,var(--bg) 180px)}button,input,select{font:inherit}.top{max-width:1000px;margin:auto;padding:28px 18px;color:#fff;display:flex;justify-content:space-between;gap:15px}.top h1{margin:0;font-size:1.55rem}.top p{margin:5px 0 0;opacity:.85;font-size:.85rem}.status{height:max-content;padding:8px 12px;border-radius:999px;background:#ffffff20;font-size:.8rem}.wrap{max-width:1000px;margin:auto;padding:0 18px 30px}.card{background:var(--card);border-radius:16px;box-shadow:0 16px 40px #0f172a20;overflow:hidden}.head{padding:20px 22px 13px;border-bottom:1px solid var(--border)}.head h2{font-size:1rem;margin:0}.head p{font-size:.78rem;color:var(--muted);margin:5px 0 0}form{padding:20px 22px}.msg{display:none;padding:11px 13px;border-radius:9px;margin-bottom:15px;font-size:.82rem;font-weight:700}.msg.error{display:block;background:#fef2f2;color:var(--bad)}.msg.success{display:block;background:#f0fdf4;color:var(--ok)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;font-size:.76rem;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;min-height:44px;padding:10px;border:1px solid var(--border);border-radius:9px;background:#fff}.field input:focus,.field select:focus{outline:3px solid #08776b20;border-color:var(--p)}.variant{display:none}.variant.show{display:block}.summary{margin-top:18px;padding:15px;border-radius:11px;background:#e9f7f5;display:grid;grid-template-columns:repeat(3,1fr)}.sl{font-size:.65rem;color:var(--muted);font-weight:800}.sv{color:var(--pd);font-weight:900;margin-top:4px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;padding-top:17px;border-top:1px solid var(--border)}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.light{background:#e2e8f0}.primary{background:var(--p);color:#fff}button:disabled{opacity:.55;cursor:wait}@media(max-width:650px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr;gap:12px}.summary>div:last-child{grid-column:1/-1}.top{padding:20px 12px}.wrap{padding:0 12px 24px}form,.head{padding-left:15px;padding-right:15px}.actions button{flex:1}}
</style></head>
<body>
<header class="top"><div><h1>Producción Costura</h1><p>JV International · Captura de operaciones</p></div><div id="status" class="status">Conectando…</div></header>
<main class="wrap"><section class="card"><div class="head"><h2>Nueva captura</h2><p>La tarifa se consulta directamente del catálogo oficial.</p></div>
<form id="form"><div id="msg" class="msg"></div><div class="grid">
<div class="field"><label>Fecha *</label><input id="fecha" type="date" required></div>
<div class="field"><label>Personal *</label><select id="personal" required disabled><option>Cargando…</option></select></div>
<div class="field"><label>Máquina *</label><select id="maquina" required disabled><option>Cargando…</option></select></div>
<div class="field"><label>No. de corte *</label><input id="corte" required placeholder="Ej. 185393"></div>
<div class="field"><label>Estilo *</label><select id="estilo" required disabled><option>Cargando…</option></select></div>
<div id="variantBox" class="field variant"><label>Variante *</label><select id="variante"><option>GENERAL</option><option>DC</option></select></div>
<div class="field"><label>Operación *</label><select id="operacion" required disabled><option>Selecciona primero un estilo</option></select></div>
<div class="field"><label>Cantidad *</label><input id="cantidad" type="number" min="1" step="1" value="1" required></div>
</div><div class="summary"><div><div class="sl">COSTO UNITARIO</div><div id="unit" class="sv">$0.00</div></div><div><div class="sl">CANTIDAD</div><div id="qty" class="sv">1</div></div><div><div class="sl">COSTO TOTAL</div><div id="total" class="sv">$0.00</div></div></div>
<div class="actions"><button type="button" id="clear" class="light">Limpiar</button><button id="save" class="primary" disabled>Guardar captura</button></div></form></section></main>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbyiN8WA6qxJlK0s3X6trL_-sI6KTseDezjQ-5LWYyBsA2P5NvK5cf8yAeK-KruRaQ3r1A/exec';
const $=id=>document.getElementById(id), state={ops:[],cost:0,ready:false}; const mxn=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'});
document.addEventListener('DOMContentLoaded',()=>{const d=new Date();$('fecha').value=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');$('estilo').addEventListener('change',styleChanged);$('variante').addEventListener('change',loadOps);$('operacion').addEventListener('change',calc);$('cantidad').addEventListener('input',calc);$('clear').addEventListener('click',reset);$('form').addEventListener('submit',save);loadCatalogs()});
async function get(action,params={}){const q=new URLSearchParams({action,...params});const r=await fetch(API_URL+'?'+q,{cache:'no-store',redirect:'follow'});if(!r.ok)throw Error('Error HTTP '+r.status);const d=await r.json();if(!d.ok)throw Error(d.error||'Error de API');return d}
async function loadCatalogs(){try{const data=await get('catalogs');const c=data.catalogs;if(!c||!Array.isArray(c.estilos)||!c.estilos.length)throw Error('La API no devolvió estilos.');fill('personal',c.personal||[],'Selecciona personal');fill('maquina',c.maquinas||[],'Selecciona máquina');fill('estilo',c.estilos,'Selecciona estilo');state.ready=true;$('save').disabled=false;$('status').textContent='● Conectado'}catch(e){show(e.message,'error');$('status').textContent='● Sin conexión'}}
function fill(id,values,label){const s=$(id),a=[...new Set(values.filter(Boolean).map(String))].sort((x,y)=>x.localeCompare(y,'es'));s.innerHTML='<option value="">'+esc(label)+'</option>'+a.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');s.disabled=!a.length}
async function styleChanged(){const jr=$('estilo').value==='JR154';$('variantBox').classList.toggle('show',jr);$('variante').value='GENERAL';await loadOps()}
async function loadOps(){const estilo=$('estilo').value;if(!estilo){fill('operacion',[],'Selecciona primero un estilo');return}try{const data=await get('operations',{estilo,variante:estilo==='JR154'?$('variante').value:'GENERAL'});const map=new Map();(data.operaciones||[]).forEach(x=>{if(x.operacion&&!map.has(x.operacion))map.set(x.operacion,{operacion:x.operacion,costo:Number(x.costo)||0})});state.ops=[...map.values()];fill('operacion',state.ops.map(x=>x.operacion),'Selecciona operación');hide()}catch(e){show(e.message,'error')}}
function calc(){const op=state.ops.find(x=>x.operacion===$('operacion').value);state.cost=op?op.costo:0;const q=Math.max(0,parseInt($('cantidad').value,10)||0);$('unit').textContent=mxn.format(state.cost);$('qty').textContent=q;$('total').textContent=mxn.format(q*state.cost)}
async function save(e){e.preventDefault();hide();const payload={fecha:$('fecha').value,personal:$('personal').value,maquina:$('maquina').value,corte:$('corte').value.trim(),estilo:$('estilo').value,variante:$('estilo').value==='JR154'?$('variante').value:'GENERAL',operacion:$('operacion').value,cantidad:Number($('cantidad').value)};if(!payload.fecha||!payload.personal||!payload.maquina||!payload.corte||!payload.estilo||!payload.operacion||!Number.isInteger(payload.cantidad)||payload.cantidad<1){show('Completa correctamente todos los campos.','error');return}$('save').disabled=true;$('save').textContent='Guardando…';try{const body=new URLSearchParams({action:'saveProduction',payload:JSON.stringify(payload)});const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:body.toString(),redirect:'follow'});const d=await r.json();if(!d.ok)throw Error(d.error||'No se pudo guardar');show('Captura guardada. Folio: '+(d.folio||'generado')+'.','success');reset(true)}catch(err){show(err.message,'error')}finally{$('save').disabled=!state.ready;$('save').textContent='Guardar captura'}}
function reset(keep=false){const f=$('fecha').value;$('form').reset();$('fecha').value=f;$('cantidad').value=1;$('variantBox').classList.remove('show');fill('operacion',[],'Selecciona primero un estilo');state.ops=[];state.cost=0;calc();if(!keep)hide()}
function show(t,type){$('msg').textContent=t;$('msg').className='msg '+type}function hide(){$('msg').className='msg';$('msg').textContent=''}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
