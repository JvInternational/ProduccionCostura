<title>Producción Costura V3.3 FINAL</title>

<body>
<div class="app">
<aside>
<div class="brand">JV International</div>
<div class="nav">Captura diaria V3.3 FINAL</div>
</aside>
<main>
<h1>Producción Costura</h1>
<div class="sub">Captura conectada a Google Sheets. Estilos tomados de Precios.xlsx.</div>
<section class="panel">
<div class="folio">
<label>Último folio guardado</label>
<b id="folio">Se asigna al guardar</b>
<svg id="barcode">
</svg>
</div>
<form id="form">
<div class="grid">
<div class="field">
<label>Fecha *</label>
<input id="fecha" type="date" required>
</div>
<div class="field">
<label>Semana ISO</label>
<input id="semana" type="text" readonly required>
</div>
<div class="field">
<label>Nombre Personal *</label>
<select id="personal" required>
</select>
</div>
<div class="field">
<label>Máquina *</label>
<select id="maquina" required>
</select>
</div>
<div class="field">
<label>No. Corte *</label>
<input id="corte" type="text" required>
</div>
<div class="field">
<label>Estilo *</label>
<input id="estilo" list="estilosLista" required>
<datalist id="estilosLista">
</datalist>
</div>
<div class="field">
<label>Proceso *</label>
<select id="proceso" required>
</select>
</div>
<div class="field">
<label>Costo unitario *</label>
<input id="costo" type="number" min="0" step="0.01" required>
</div>
<div class="field">
<label>Cantidad *</label>
<input id="cantidad" type="number" min="1" step="1" required>
</div>
</div>
<div class="actions">
<button id="guardar" class="primary">Guardar en la nube</button>
<button type="button" id="limpiar" class="secondary">Limpiar</button>
<button type="button" id="exportar" class="secondary">Exportar sesión CSV</button>
<span id="status">
</span>
</div>
</form>
</section>
<div class="sum">
<div class="kpi">
<small>Registros de sesión</small>
<b id="kr">0</b>
</div>
<div class="kpi">
<small>Cantidad de sesión</small>
<b id="kq">0</b>
</div>
<div class="kpi">
<small>Costo de sesión</small>
<b id="kc">$0.00</b>
</div>
</div>
<section class="panel">
<b>Capturas confirmadas</b>
<div id="tabla">
</div>
</section>
</main>
</div>

function price(){let e=clean($('estilo').value).toUpperCase(),o=clean($('proceso').value).toUpperCase(),m=CAT.precios.find(x=>x.e===e&&x.o===o);if(m)$('costo').value=m.c.toFixed(2)}
