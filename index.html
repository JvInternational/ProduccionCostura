<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Producción Costura</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f6f5;
      font-family: Segoe UI, Arial, sans-serif;
      color: #192622;
    }
    .app {
      display: flex;
      min-height: 100vh;
    }
    aside {
      width: 220px;
      background: #101a20;
      color: #fff;
      padding: 18px 16px;
    }
    .brand {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: .06em;
      margin-bottom: 18px;
    }
    .nav {
      background: #21342f;
      padding: 12px;
      border-radius: 8px;
      color: #dfe7e3;
    }
    main {
      flex: 1;
      padding: 28px 26px;
    }
    h1 {
      margin: 0 0 8px;
    }
    .sub {
      color: #687873;
      margin-bottom: 18px;
    }
    .panel {
      background: #fff;
      border: 1px solid #dfe8e5;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 18px rgba(21, 59, 50, 0.06);
    }
    .folio {
      background: #f7faf9;
      border: 1px solid #dfe8e5;
      border-radius: 9px;
      padding: 12px 16px;
      margin-bottom: 18px;
    }
    .folio label {
      display: block;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 14px;
    }
    .field {
      display: grid;
      gap: 6px;
    }
    label {
      font-size: 10px;
      color: #71807c;
      text-transform: uppercase;
      font-weight: 700;
    }
    input, select {
      height: 40px;
      border: 1px solid #dfe8e5;
      border-radius: 8px;
      padding: 0 10px;
      background: #fff;
      font-size: 15px;
    }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    button {
      height: 39px;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary {
      background: #08776b;
      color: #fff;
    }
    .secondary {
      background: #e7efe9;
      color: #173b35;
    }
    button:disabled {
      opacity: .6;
      cursor: wait;
    }
    #status {
      min-height: 20px;
      display: inline-block;
      font-weight: 700;
    }
    .ok { color: #0f7d52; }
    .err { color: #b42318; }
    .sum {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }
    .kpi {
      border-left: 4px solid #08776b;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(21, 59, 50, 0.04);
    }
    .kpi small {
      display: block;
      color: #687873;
      margin-bottom: 6px;
    }
    .kpi b {
      font-size: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      padding: 9px;
      border-bottom: 1px solid #edf1f0;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: #f6f9f7;
      color: #1f352f;
      font-weight: 700;
    }
    .wrap {
      overflow-x: auto;
    }
    @media (max-width: 700px) {
      .app { display: block; }
      aside { width: 100%; }
      .grid, .sum { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <iframe id="hiddenFrame" name="hiddenFrame" style="display:none"></iframe>

  <div class="app">
    <aside>
      <div class="brand">JV International</div>
      <div class="nav">Captura diaria</div>
    </aside>

    <main>
      <h1>Producción Costura</h1>
      <div class="sub">Captura conectada a Google Sheets.</div>

      <section class="panel">
        <div class="folio">
          <label>Último folio guardado</label>
          <b id="folio">Se asigna al guardar</b>
          <svg id="barcode"></svg>
        </div>

        <form id="form">
          <div class="grid">
            <div class="field">
              <label>Fecha *</label>
              <input id="fecha" type="date" required>
            </div>

            <div class="field">
              <label>Semana ISO</label>
              <input id="semana" type="text" readonly required>
            </div>

            <div class="field">
              <label>Nombre Personal *</label>
              <select id="personal" required></select>
            </div>

            <div class="field">
              <label>Máquina *</label>
              <select id="maquina" required></select>
            </div>

            <div class="field">
              <label>No. Corte *</label>
              <input id="corte" type="text" required>
            </div>

            <div class="field">
              <label>Estilo *</label>
              <input id="estilo" list="estilosLista" required>
              <datalist id="estilosLista"></datalist>
            </div>

            <div class="field">
              <label>Proceso *</label>
              <select id="proceso" required></select>
            </div>

            <div class="field">
              <label>Costo unitario *</label>
              <input id="costo" type="number" min="0" step="0.01" required>
            </div>

            <div class="field">
              <label>Cantidad *</label>
              <input id="cantidad" type="number" min="1" step="1" required>
            </div>
          </div>

          <div class="actions">
            <button id="guardar" class="primary">Guardar en la nube</button>
            <button type="button" id="limpiar" class="secondary">Limpiar</button>
            <button type="button" id="exportar" class="secondary">Exportar sesión CSV</button>
            <span id="status"></span>
          </div>
        </form>
      </section>

      <div class="sum">
        <div class="kpi">
          <small>Registros de sesión</small>
          <b id="kr">0</b>
        </div>
        <div class="kpi">
          <small>Cantidad de sesión</small>
          <b id="kq">0</b>
        </div>
        <div class="kpi">
          <small>Costo de sesión</small>
          <b id="kc">$0.00</b>
        </div>
      </div>

      <section class="panel">
        <b>Capturas confirmadas</b>
        <div id="tabla"></div>
      </section>
    </main>
  </div>

  <script>
    const app = {
      config: {
        apiUrl: "https://script.google.com/macros/s/AKfycbyiN8WA6qxJlK0s3X6trL_-sI6KTseDezjQ-5LWYyBsA2P5NvK5cf8yAeK-KruRaQ3r1A/exec",
        storageKey: "jvCosturaRespaldo"
      },

      state: {
        records: []
      },

      ui: {},

      catalog: {
        personal: [
          "CORRIL MACARIO","ELIUD ARCOS","ESPINOZA ISABEL","ESTRADA RAMON","GARCIA GUSTAVO",
          "GARCIA RIGOBERTO","GARCIA VICTOR","GASPAR CLARA","HERNANDEZ GUILLERMO","HERNANDEZ LAURA",
          "HERNANDEZ NICOLAS","JUSTO ELISEO","KAREN","LANDERO JUAN","LOPEZ SANDRA","MALDONADO LUIS",
          "MARCIAL JULIO","MEJIA ROCIO","MONTERO LILIANA","NAVARRO ROSARIO","PARA MIGUEL","PEDRO PABLO",
          "PEDRO PABLO FELIX","PEREZ NIDIA","COLIMB RUIZ","RODRIGO SERRANO","SANCHEZ CRISTINA",
          "SANTOS FELIX","SANTOS FRANCISCO","ZAMORA SAN JUAN"
        ],
        maquinas: ["OVER","COVER","TAPE","SENCILLA"],
        operaciones: [
          "1ER HOMBRE","2DO HOMBRE","BASTILLA MANGA","BASTILLA RUEDO","BIES CUELLO",
          "BIES SIZA","CERRAR COSTADOS","CERRAR HOMBROS","CLIP","DESHEBRADO","PEGAR CUELLO",
          "PEGAR MANGA","REMACHE","S/ C CUELLO","TAPE","TAPES"
        ],
        estilos: [
          "BY01","BY02","BY03","BY04","BY05","BY06","GR02","GR08","JR154","JR44","JR47","JR48","MN01","MN02","MN03","TD02"
        ],
        precios: [
          { e: "JR154", o: "CERRAR HOMBROS", c: 0.4 },
          { e: "JR154", o: "PEGAR CUELLO", c: 0.7 },
          { e: "JR154", o: "S/ C CUELLO", c: 0.4 },
          { e: "JR154", o: "PEGAR MANGA", c: 0.8 },
          { e: "JR154", o: "CERRAR COSTADOS", c: 0.9 },
          { e: "JR154", o: "BASTILLA MANGA", c: 0.7 },
          { e: "JR154", o: "BASTILLA RUEDO", c: 0.7 },
          { e: "JR154", o: "DESHEBRADO", c: 0.0 },
          { e: "JR44", o: "CERRAR HOMBROS", c: 0.4 },
          { e: "JR44", o: "PEGAR CUELLO", c: 0.7 },
          { e: "JR44", o: "S/ C CUELLO", c: 0.4 },
          { e: "JR44", o: "PEGAR MANGA", c: 0.8 },
          { e: "JR44", o: "CERRAR COSTADOS", c: 0.9 },
          { e: "JR44", o: "BASTILLA MANGA", c: 0.7 },
          { e: "JR44", o: "BASTILLA RUEDO", c: 0.7 },
          { e: "JR44", o: "DESHEBRADO", c: 0.0 },
          { e: "JR47", o: "CERRAR HOMBROS", c: 0.4 },
          { e: "JR47", o: "PEGAR CUELLO", c: 0.7 },
          { e: "JR47", o: "S/ C CUELLO", c: 0.4 },
          { e: "JR47", o: "PEGAR MANGA", c: 0.8 },
          { e: "JR47", o: "CERRAR COSTADOS", c: 0.9 },
          { e: "JR47", o: "BASTILLA MANGA", c: 0.7 },
          { e: "JR47", o: "BASTILLA RUEDO", c: 0.7 },
          { e: "JR47", o: "DESHEBRADO", c: 0.0 },
          { e: "JR48", o: "CERRAR HOMBROS", c: 0.4 },
          { e: "JR48", o: "PEGAR CUELLO", c: 0.7 },
          { e: "JR48", o: "S/ C CUELLO", c: 0.4 },
          { e: "JR48", o: "PEGAR MANGA", c: 0.8 },
          { e: "JR48", o: "CERRAR COSTADOS", c: 0.9 },
          { e: "JR48", o: "BASTILLA MANGA", c: 0.7 },
          { e: "JR48", o: "BASTILLA RUEDO", c: 0.7 },
          { e: "JR48", o: "DESHEBRADO", c: 0.0 },
          { e: "GR08", o: "CERRAR HOMBROS", c: 0.4 },
          { e: "GR08", o: "PEGAR CUELLO", c: 0.7 },
          { e: "GR08", o: "S/ C CUELLO", c: 0.4 },
          { e: "GR08", o: "PEGAR MANGA", c: 0.8 },
          { e: "GR08", o: "CERRAR COSTADOS", c: 0.9 },
          { e: "GR08", o: "BASTILLA MANGA", c: 0.7 },
          { e: "GR08", o: "BASTILLA RUEDO", c: 0.7 },
          { e: "GR08", o: "DESHEBRADO", c: 0.0 },
          { e: "MN03", o: "CERRAR HOMBROS", c: 0.4 },
          { e: "MN03", o: "PEGAR CUELLO", c: 0.7 },
          { e: "MN03", o: "S/ C CUELLO", c: 0.4 },
          { e: "MN03", o: "TAPE", c: 0.6 },
          { e: "MN03", o: "PEGAR MANGA", c: 0.8 },
          { e: "MN03", o: "CERRAR COSTADOS", c: 0.9 },
          { e: "MN03", o: "BASTILLA MANGA", c: 0.7 },
          { e: "MN03", o: "BASTILLA RUEDO", c: 0.7 },
          { e: "MN03", o: "DESHEBRADO", c: 0.0 },
          { e: "BY02", o: "CERRAR HOMBROS", c: 0.4 },
          { e: "BY02", o: "PEGAR CUELLO", c: 0.7 },
          { e: "BY02", o: "S/ C CUELLO", c: 0.4 },
          { e: "BY02", o: "TAPE", c: 0.6 },
          { e: "BY02", o: "PEGAR MANGA", c: 0.8 },
          { e: "BY02", o: "CERRAR COSTADOS", c: 0.9 },
          { e: "BY02", o: "BASTILLA MANGA", c: 0.7 },
          { e: "BY02", o: "BASTILLA RUEDO", c: 0.7 },
          { e: "BY02", o: "DESHEBRADO", c: 0.0 }
        ]
      },

      money(value) {
        return new Intl.NumberFormat("es-MX", {
          style: "currency",
          currency: "MXN"
        }).format(Number(value || 0));
      },

      clean(value) {
        return String(value ?? "").trim().replace(/\\s+/g, " ");
      },

      getElement(id) {
        return document.getElementById(id);
      },

      fillSelect(id, values, label) {
        const el = this.getElement(id);
        el.replaceChildren();
        const defaultOption = new Option(label, "");
        el.add(defaultOption);
        values.forEach(v => el.add(new Option(v, v)));
      },

      weekFromDate(value) {
        if (!value) return "";
        const d = new Date(value + "T12:00:00");
        d.setDate(d.getDate() + 4 - (d.getDay() || 7));
        return Math.ceil((((d - new Date(d.getFullYear(), 0, 1)) / 86400000) + 1) / 7);
      },

      updateWeek() {
        const fecha = this.clean(this.ui.fecha.value);
        this.ui.semana.value = this.weekFromDate(fecha);
      },

      autofillPrecio() {
        const estilo = this.clean(this.ui.estilo.value).toUpperCase();
        const proceso = this.clean(this.ui.proceso.value).toUpperCase();
        const match = this.catalog.precios.find(x => x.e === estilo && x.o === proceso);
        if (match) {
          this.ui.costo.value = Number(match.c).toFixed(2);
        }
      },

      setStatus(message, type = "") {
        const statusEl = this.ui.status;
        statusEl.textContent = message;
        statusEl.className = type;
      },

      normalizeRecord(raw) {
        return {
          fecha: String(raw.fecha || "").trim(),
          semana: Number(raw.semana || 0),
          personal: this.clean(raw.personal),
          maquina: this.clean(raw.maquina),
          corte: this.clean(raw.corte),
          estilo: this.clean(raw.estilo).toUpperCase(),
          proceso: this.clean(raw.proceso).toUpperCase(),
          costoUnitario: Number(raw.costoUnitario || 0),
          cantidad: Number(raw.cantidad || 0),
          costoTotal: Number((Number(raw.cantidad || 0) * Number(raw.costoUnitario || 0)).toFixed(2))
        };
      },

      validateRecord(record) {
        const errors = [];

        if (!record.fecha) errors.push("Falta la fecha");
        if (!record.personal) errors.push("Falta personal");
        if (!record.maquina) errors.push("Falta máquina");
        if (!record.corte) errors.push("Falta No. de corte");
        if (!record.estilo) errors.push("Falta estilo");
        if (!record.proceso) errors.push("Falta proceso");
        if (!record.cantidad || Number(record.cantidad) <= 0) errors.push("Cantidad inválida");
        if (!record.costoUnitario || Number(record.costoUnitario) < 0) errors.push("Costo inválido");

        return { ok: errors.length === 0, errors };
      },

      loadLocalRecords() {
        try {
          const raw = localStorage.getItem(this.config.storageKey);
          this.state.records = raw ? JSON.parse(raw) : [];
        } catch {
          this.state.records = [];
        }
      },

      saveLocalRecords() {
        localStorage.setItem(this.config.storageKey, JSON.stringify(this.state.records));
      },

      submitToGoogle(payload) {
        const form = document.createElement("form");
        form.method = "POST";
        form.action = this.config.apiUrl;
        form.target = "hiddenFrame";

        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "payload";
        input.value = JSON.stringify(payload);

        form.appendChild(input);
        document.body.appendChild(form);
        form.submit();

        setTimeout(() => {
          form.remove();
        }, 1000);
      },

      createFolio() {
        return "LOCAL-" + Date.now();
      },

      handleSubmit(event) {
        event.preventDefault();

        const raw = {
          fecha: this.ui.fecha.value,
          semana: this.ui.semana.value,
          personal: this.ui.personal.value,
          maquina: this.ui.maquina.value,
          corte: this.ui.corte.value,
          estilo: this.ui.estilo.value,
          proceso: this.ui.proceso.value,
          costoUnitario: this.ui.costo.value,
          cantidad: this.ui.cantidad.value
        };

        const record = this.normalizeRecord(raw);
        const validation = this.validateRecord(record);

        if (!validation.ok) {
          this.setStatus(validation.errors.join(", "), "err");
          return;
        }

        const folio = this.createFolio();
        const item = {
          ...record,
          folio,
          createdAt: new Date().toISOString()
        };

        this.state.records.push(item);
        this.saveLocalRecords();

        this.submitToGoogle(record);

        this.ui.folio.textContent = folio;

        if (window.JsBarcode) {
          JsBarcode("#barcode", folio, {
            format: "CODE128",
            height: 42,
            margin: 4,
            fontSize: 12
          });
        }

        this.renderSummary();
        this.renderTable();
        this.clearForm();
        this.setStatus("Captura " + folio + " guardada correctamente.", "ok");
      },

      renderSummary() {
        const totalCantidad = this.state.records.reduce((sum, x) => sum + Number(x.cantidad || 0), 0);
        const totalCosto = this.state.records.reduce((sum, x) => sum + Number(x.costoTotal || 0), 0);

        this.ui.kr.textContent = String(this.state.records.length);
        this.ui.kq.textContent = String(totalCantidad);
        this.ui.kc.textContent = this.money(totalCosto);
      },

      renderTable() {
        const tableWrap = this.getElement("tabla");

        if (!this.state.records.length) {
          tableWrap.textContent = "Sin capturas confirmadas en esta sesión.";
          return;
        }

        const rows = this.state.records
          .slice()
          .reverse()
          .map(x => `
            <tr>
              <td>${x.folio}</td>
              <td>${x.fecha}</td>
              <td>${x.personal}</td>
              <td>${x.maquina}</td>
              <td>${x.corte}</td>
              <td>${x.estilo}</td>
              <td>${x.proceso}</td>
              <td>${x.cantidad}</td>
              <td>${this.money(x.costoTotal)}</td>
            </tr>
          `).join("");

        tableWrap.innerHTML = `
          <div class="wrap">
            <table>
              <tr>
                <th>Folio</th>
                <th>Fecha</th>
                <th>Personal</th>
                <th>Máquina</th>
                <th>Corte</th>
                <th>Estilo</th>
                <th>Proceso</th>
                <th>Cantidad</th>
                <th>Total</th>
              </tr>
              ${rows}
            </table>
          </div>
        `;
      },

      exportCsv() {
        if (!this.state.records.length) {
          alert("No hay capturas.");
          return;
        }

        const header = [
          "Folio","Fecha","Semana","Nombre Personal","Maquina","No. Corte","Estilo","Proceso","Costo Unitario","Cantidad","Costo Total"
        ];

        const rows = this.state.records.map(x => [
          x.folio,
          x.fecha,
          x.semana,
          x.personal,
          x.maquina,
          x.corte,
          x.estilo,
          x.proceso,
          x.costoUnitario,
          x.cantidad,
          x.costoTotal
        ]);

        const csvRows = [header, ...rows].map(row =>
          row.map(v => `"${String(v).replace(/\"/g, '\"\"')}"`).join(",")
        );

        const blob = new Blob([csvRows.join("\r\n")], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Produccion_Costura.csv";
        a.click();
        URL.revokeObjectURL(url);
      },

      clearForm() {
        const fecha = this.ui.fecha.value;
        const personal = this.ui.personal.value;

        this.ui.form.reset();
        this.ui.fecha.value = fecha;
        this.ui.personal.value = personal;
        this.updateWeek();
      },

      bindEvents() {
        this.ui.form.addEventListener("submit", (e) => this.handleSubmit(e));
        this.ui.fecha.addEventListener("change", () => this.updateWeek());
        this.ui.estilo.addEventListener("change", () => this.autofillPrecio());
        this.ui.proceso.addEventListener("change", () => this.autofillPrecio());
        this.getElement("limpiar").addEventListener("click", () => this.clearForm());
        this.getElement("exportar").addEventListener("click", () => this.exportCsv());
      },

      init() {
        this.ui = {
          form: this.getElement("form"),
          fecha: this.getElement("fecha"),
          semana: this.getElement("semana"),
          personal: this.getElement("personal"),
          maquina: this.getElement("maquina"),
          corte: this.getElement("corte"),
          estilo: this.getElement("estilo"),
          proceso: this.getElement("proceso"),
          costo: this.getElement("costo"),
          cantidad: this.getElement("cantidad"),
          status: this.getElement("status"),
          folio: this.getElement("folio"),
          barcode: this.getElement("barcode"),
          tabla: this.getElement("tabla"),
          kr: this.getElement("kr"),
          kq: this.getElement("kq"),
          kc: this.getElement("kc")
        };

        this.fillSelect("personal", this.catalog.personal, "Seleccione personal");
        this.fillSelect("maquina", this.catalog.maquinas, "Seleccione máquina");
        this.fillSelect("proceso", this.catalog.operaciones, "Seleccione proceso");

        this.catalog.estilos.forEach(x => {
          const option = new Option(x, x);
          this.getElement("estilosLista").appendChild(option);
        });

        this.loadLocalRecords();
        this.bindEvents();

        this.ui.fecha.value = new Date().toISOString().slice(0, 10);
        this.updateWeek();
        this.renderSummary();
        this.renderTable();
        this.setStatus("Catálogos cargados.", "ok");
      }
    };

    app.init();
  </script>
</body>
</html>
